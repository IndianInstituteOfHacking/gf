name: Build RootBrowser Windows

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install aqtinstall
        run: |
          python -m pip install --upgrade pip
          python -m pip install aqtinstall

      - name: Cache Qt
        id: cache-qt
        uses: actions/cache@v4
        with:
          path: C:\Qt
          key: qt-6.6.0-msvc2019_64-v9

      - name: Install Qt 6.6.0 base
        if: steps.cache-qt.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          python -m aqt install-qt windows desktop 6.6.0 win64_msvc2019_64 `
            --outputdir C:\Qt `
            --archives qtbase qtsvg

      - name: Install Qt modules
        if: steps.cache-qt.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          python -m aqt install-qt windows desktop 6.6.0 win64_msvc2019_64 `
            --outputdir C:\Qt `
            --modules qtwebengine qtwebchannel qtpositioning

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Generate resources
        shell: cmd
        run: |
          if exist resources.qrc (
            "C:\Qt\6.6.0\msvc2019_64\bin\rcc.exe" resources.qrc -o resources.cpp
            echo [OK] resources.cpp generated
          )

      - name: Compile RootBrowser
        shell: cmd
        run: |
          mkdir build 2>nul
          
          cl /nologo /std:c++17 /Zc:__cplusplus /permissive- /EHsc /O2 /MD /DNDEBUG ^
             /DNOMINMAX /DWIN32_LEAN_AND_MEAN /bigobj /utf-8 /Zm500 ^
             /I "C:\Qt\6.6.0\msvc2019_64\include" ^
             /I "C:\Qt\6.6.0\msvc2019_64\include\QtCore" ^
             /I "C:\Qt\6.6.0\msvc2019_64\include\QtGui" ^
             /I "C:\Qt\6.6.0\msvc2019_64\include\QtWidgets" ^
             /I "C:\Qt\6.6.0\msvc2019_64\include\QtNetwork" ^
             /I "C:\Qt\6.6.0\msvc2019_64\include\QtWebEngineWidgets" ^
             /I "C:\Qt\6.6.0\msvc2019_64\include\QtWebEngineCore" ^
             /I "C:\Qt\6.6.0\msvc2019_64\include\QtWebChannel" ^
             /I "C:\Qt\6.6.0\msvc2019_64\include\QtSvg" ^
             /Fe:"build\RootBrowser.exe" ^
             main.cpp ^
             connector.cpp ^
             viewpagesource.cpp ^
             webadblocker.cpp ^
             bookmarkstore.cpp ^
             bookmarkpage.cpp ^
             downloadmanager.cpp ^
             downloadpage.cpp ^
             downloadpanel.cpp ^
             historystore.cpp ^
             historypage.cpp ^
             settingsstore.cpp ^
             settingspage.cpp ^
             findinpage.cpp ^
             torcontroller.cpp ^
             privatemodepage.cpp ^
             privatehomepage.cpp ^
             privatebrowser.cpp ^
             httpsonly.cpp ^
             commandpalette.cpp ^
             fingerprintprotection.cpp ^
             urlautocomplete.cpp ^
             bookmarksbar.cpp ^
             downloadnotification.cpp ^
             downloadtoast.cpp ^
             shortcuthelp.cpp ^
             background.cpp ^
             resources.cpp ^
             /link /SUBSYSTEM:WINDOWS /ENTRY:mainCRTStartup ^
             /LIBPATH:"C:\Qt\6.6.0\msvc2019_64\lib" ^
             Qt6WebEngineWidgets.lib Qt6WebEngineCore.lib ^
             Qt6Widgets.lib Qt6Gui.lib Qt6Core.lib Qt6Network.lib ^
             Qt6Svg.lib ^
             user32.lib shell32.lib advapi32.lib ole32.lib

          if not exist "build\RootBrowser.exe" (
            echo [ERROR] Compile failed
            exit /b 1
          )
          echo [OK] RootBrowser.exe built

      - name: Bundle Qt DLLs
        shell: cmd
        run: |
          "C:\Qt\6.6.0\msvc2019_64\bin\windeployqt.exe" ^
             --release ^
             --no-translations ^
             --no-system-d3d-compiler ^
             --no-opengl-sw ^
             --no-compiler-runtime ^
             --webenginecore ^
             "build\RootBrowser.exe"
          
          echo === Verify critical DLLs ===
          if not exist "build\Qt6Core.dll" (echo [ERROR] Qt6Core.dll missing && exit /b 1)
          if not exist "build\Qt6Gui.dll" (echo [ERROR] Qt6Gui.dll missing && exit /b 1)
          if not exist "build\Qt6Widgets.dll" (echo [ERROR] Qt6Widgets.dll missing && exit /b 1)
          if not exist "build\Qt6Network.dll" (echo [ERROR] Qt6Network.dll missing && exit /b 1)
          if not exist "build\Qt6WebEngineCore.dll" (echo [ERROR] Qt6WebEngineCore.dll missing && exit /b 1)
          if not exist "build\Qt6WebEngineWidgets.dll" (echo [ERROR] Qt6WebEngineWidgets.dll missing && exit /b 1)
          echo [OK] All critical DLLs present

      - name: Package release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          
          Copy-Item "build\RootBrowser.exe" release\
          Get-ChildItem -Path "build\*.dll" -ErrorAction SilentlyContinue | Copy-Item -Destination release\
          
          foreach ($folder in @("platforms", "styles", "imageformats", "iconengines", "networkinformation", "tls", "translations", "resources", "qml", "webchannel")) {
            if (Test-Path "build\$folder") {
              Copy-Item -Recurse "build\$folder" release\
            }
          }
          
          if (Test-Path "background.png") { Copy-Item "background.png" release\ }
          if (Test-Path "nighttheme.png") { Copy-Item "nighttheme.png" release\ }
          
          $readme = "RootBrowser v1.0 - Windows Portable`n`nHOW TO RUN:`n1. Extract this folder anywhere`n2. Double-click RootBrowser.exe`n`nSHORTCUTS:`nCtrl+T  New tab`nCtrl+W  Close tab`nCtrl+L  Address bar`nCtrl+K  Command palette`nCtrl+F  Find in page`nCtrl+H  History`nCtrl+J  Downloads`nCtrl+,  Settings`nCtrl+Shift+N  Tor mode`nF11  Fullscreen"
          $readme | Out-File -FilePath "release\README.txt" -Encoding UTF8
          
          Compress-Archive -Path release\* -DestinationPath RootBrowser-Windows.zip -Force
          
          $size = [math]::Round((Get-Item RootBrowser-Windows.zip).Length/1MB, 2)
          Write-Host ""
          Write-Host "=== Package size: $size MB ===" -ForegroundColor Green
          
          Write-Host "=== Contents ===" -ForegroundColor Cyan
          Get-ChildItem release\ | Select-Object Name | Format-Table -AutoSize

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RootBrowser-Windows
          path: RootBrowser-Windows.zip
          retention-days: 90

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: RootBrowser-Windows.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
