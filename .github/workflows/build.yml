name: Build RootBrowser Windows

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install aqtinstall
        run: |
          python -m pip install --upgrade pip
          python -m pip install aqtinstall

      - name: Install Qt 6.6.0 (full)
        shell: pwsh
        run: |
          python -m aqt install-qt windows desktop 6.6.0 win64_msvc2019_64 `
            --outputdir C:\Qt `
            --archives qtbase qtsvg
          python -m aqt install-qt windows desktop 6.6.0 win64_msvc2019_64 `
            --outputdir C:\Qt `
            --modules qtwebengine qtwebchannel qtpositioning

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Generate resources
        shell: cmd
        run: |
          if exist resources.qrc (
            "C:\Qt\6.6.0\msvc2019_64\bin\rcc.exe" resources.qrc -o resources.cpp
          )

      - name: Compile
        shell: cmd
        run: |
          mkdir build 2>nul
          cl /nologo /std:c++17 /Zc:__cplusplus /permissive- /EHsc /O2 /MD /DNDEBUG ^
             /DNOMINMAX /DWIN32_LEAN_AND_MEAN /bigobj /utf-8 /Zm500 ^
             /I "C:\Qt\6.6.0\msvc2019_64\include" ^
             /I "C:\Qt\6.6.0\msvc2019_64\include\QtCore" ^
             /I "C:\Qt\6.6.0\msvc2019_64\include\QtGui" ^
             /I "C:\Qt\6.6.0\msvc2019_64\include\QtWidgets" ^
             /I "C:\Qt\6.6.0\msvc2019_64\include\QtNetwork" ^
             /I "C:\Qt\6.6.0\msvc2019_64\include\QtWebEngineWidgets" ^
             /I "C:\Qt\6.6.0\msvc2019_64\include\QtWebEngineCore" ^
             /I "C:\Qt\6.6.0\msvc2019_64\include\QtWebChannel" ^
             /I "C:\Qt\6.6.0\msvc2019_64\include\QtSvg" ^
             /Fe:"build\RootBrowser.exe" ^
             main.cpp connector.cpp viewpagesource.cpp webadblocker.cpp ^
             bookmarkstore.cpp bookmarkpage.cpp downloadmanager.cpp ^
             downloadpage.cpp downloadpanel.cpp historystore.cpp ^
             historypage.cpp settingsstore.cpp settingspage.cpp ^
             findinpage.cpp torcontroller.cpp privatemodepage.cpp ^
             privatehomepage.cpp privatebrowser.cpp httpsonly.cpp ^
             commandpalette.cpp fingerprintprotection.cpp urlautocomplete.cpp ^
             bookmarksbar.cpp downloadnotification.cpp downloadtoast.cpp ^
             shortcuthelp.cpp background.cpp resources.cpp ^
             /link /SUBSYSTEM:WINDOWS /ENTRY:mainCRTStartup ^
             /LIBPATH:"C:\Qt\6.6.0\msvc2019_64\lib" ^
             Qt6WebEngineWidgets.lib Qt6WebEngineCore.lib ^
             Qt6Widgets.lib Qt6Gui.lib Qt6Core.lib Qt6Network.lib ^
             Qt6Svg.lib ^
             user32.lib shell32.lib advapi32.lib ole32.lib

      - name: Bundle ALL Qt DLLs
        shell: cmd
        run: |
          "C:\Qt\6.6.0\msvc2019_64\bin\windeployqt.exe" ^
             --release --no-translations --no-system-d3d-compiler ^
             --no-opengl-sw --no-compiler-runtime ^
             --webenginecore ^
             "build\RootBrowser.exe"
          
          echo === Copy remaining DLLs ===
          for %D in (Qt6Core.dll Qt6Gui.dll Qt6Widgets.dll Qt6Network.dll Qt6Svg.dll Qt6WebEngineCore.dll Qt6WebEngineWidgets.dll Qt6WebChannel.dll Qt6Quick.dll Qt6Qml.dll Qt6Positioning.dll Qt6WebEngineQuick.dll Qt6WebEngineQuickDelegatesQml.dll) do (
            if not exist "build\%D" (
              if exist "C:\Qt\6.6.0\msvc2019_64\bin\%D" (
                copy "C:\Qt\6.6.0\msvc2019_64\bin\%D" "build\" >nul
              )
            )
          )

      - name: Create portable folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          
          # Copy EXE
          Copy-Item "build\RootBrowser.exe" release\
          
          # Copy ALL DLLs from build folder
          Get-ChildItem "build\*.dll" | Copy-Item -Destination release\
          
          # Copy ALL folders
          foreach ($f in @("platforms","styles","imageformats","iconengines","networkinformation","tls","translations","resources","qml","webchannel")) {
            if (Test-Path "build\$f") { Copy-Item -Recurse "build\$f" release\ }
          }
          
          # Copy wallpapers
          if (Test-Path "background.png") { Copy-Item "background.png" release\ }
          if (Test-Path "nighttheme.png") { Copy-Item "nighttheme.png" release\ }
          
          # Verify Qt6Gui.dll specifically
          if (-not (Test-Path "release\Qt6Gui.dll")) {
            Write-Host "ERROR: Qt6Gui.dll missing!"
            exit 1
          }
          
          # Zip
          Compress-Archive -Path release\* -DestinationPath RootBrowser-Windows.zip -Force
          
          # Show size
          $size = [math]::Round((Get-Item RootBrowser-Windows.zip).Length/1MB, 2)
          Write-Host "Package size: $size MB"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: RootBrowser-Windows
          path: RootBrowser-Windows.zip
