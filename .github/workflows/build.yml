name: Build RootBrowser Windows

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install aqtinstall
        run: |
          python -m pip install --upgrade pip
          python -m pip install aqtinstall

      - name: Cache Qt
        id: cache-qt
        uses: actions/cache@v4
        with:
          path: C:\Qt
          key: qt-6.6.0-msvc2019_64-v6

      - name: Install Qt 6.6.0 base
        if: steps.cache-qt.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          python -m aqt install-qt windows desktop 6.6.0 win64_msvc2019_64 `
            --outputdir C:\Qt `
            --archives qtbase qtsvg

      - name: Install Qt WebEngine + WebChannel modules
        if: steps.cache-qt.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          python -m aqt install-qt windows desktop 6.6.0 win64_msvc2019_64 `
            --outputdir C:\Qt `
            --modules qtwebengine qtwebchannel

      - name: Verify Qt modules
        shell: cmd
        run: |
          if not exist "C:\Qt\6.6.0\msvc2019_64\lib\Qt6WebEngineWidgets.lib" (
            echo [ERROR] WebEngine lib missing
            exit /b 1
          )
          echo [OK] WebEngine found
          if not exist "C:\Qt\6.6.0\msvc2019_64\lib\Qt6WebChannel.lib" (
            echo [WARN] WebChannel lib missing - continuing anyway
          ) else (
            echo [OK] WebChannel found
          )

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Generate resources
        shell: cmd
        run: |
          if exist resources.qrc (
            "C:\Qt\6.6.0\msvc2019_64\bin\rcc.exe" resources.qrc -o resources.cpp
            echo [OK] resources.cpp generated
          )

      - name: Compile RootBrowser
        shell: cmd
        run: |
          mkdir build 2>nul
          
          cl /nologo /std:c++17 /Zc:__cplusplus /permissive- /EHsc /O2 /MD /DNDEBUG ^
             /DNOMINMAX /DWIN32_LEAN_AND_MEAN /bigobj /utf-8 /Zm500 ^
             /I "C:\Qt\6.6.0\msvc2019_64\include" ^
             /I "C:\Qt\6.6.0\msvc2019_64\include\QtCore" ^
             /I "C:\Qt\6.6.0\msvc2019_64\include\QtGui" ^
             /I "C:\Qt\6.6.0\msvc2019_64\include\QtWidgets" ^
             /I "C:\Qt\6.6.0\msvc2019_64\include\QtNetwork" ^
             /I "C:\Qt\6.6.0\msvc2019_64\include\QtWebEngineWidgets" ^
             /I "C:\Qt\6.6.0\msvc2019_64\include\QtWebEngineCore" ^
             /I "C:\Qt\6.6.0\msvc2019_64\include\QtWebChannel" ^
             /I "C:\Qt\6.6.0\msvc2019_64\include\QtQuick" ^
             /I "C:\Qt\6.6.0\msvc2019_64\include\QtQml" ^
             /I "C:\Qt\6.6.0\msvc2019_64\include\QtSvg" ^
             /Fe:"build\RootBrowser.exe" ^
             main.cpp ^
             connector.cpp ^
             viewpagesource.cpp ^
             webadblocker.cpp ^
             bookmarkstore.cpp ^
             bookmarkpage.cpp ^
             downloadmanager.cpp ^
             downloadpage.cpp ^
             downloadpanel.cpp ^
             historystore.cpp ^
             historypage.cpp ^
             settingsstore.cpp ^
             settingspage.cpp ^
             findinpage.cpp ^
             torcontroller.cpp ^
             privatemodepage.cpp ^
             privatehomepage.cpp ^
             privatebrowser.cpp ^
             httpsonly.cpp ^
             commandpalette.cpp ^
             fingerprintprotection.cpp ^
             urlautocomplete.cpp ^
             bookmarksbar.cpp ^
             downloadnotification.cpp ^
             downloadtoast.cpp ^
             shortcuthelp.cpp ^
             background.cpp ^
             resources.cpp ^
             /link /SUBSYSTEM:WINDOWS /ENTRY:mainCRTStartup ^
             /LIBPATH:"C:\Qt\6.6.0\msvc2019_64\lib" ^
             Qt6WebEngineWidgets.lib Qt6WebEngineCore.lib ^
             Qt6Widgets.lib Qt6Gui.lib Qt6Core.lib Qt6Network.lib ^
             Qt6Svg.lib ^
             user32.lib shell32.lib advapi32.lib ole32.lib

          if not exist "build\RootBrowser.exe" (
            echo [ERROR] Compile failed
            exit /b 1
          )
          echo [OK] RootBrowser.exe built

      - name: Bundle Qt DLLs
        shell: cmd
        run: |
          "C:\Qt\6.6.0\msvc2019_64\bin\windeployqt.exe" ^
             --release ^
             --no-translations ^
             --no-system-d3d-compiler ^
             --no-opengl-sw ^
             --webenginecore ^
             "build\RootBrowser.exe"

      - name: Package release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item "build\RootBrowser.exe" release\
          Get-ChildItem -Path "build\*.dll" -ErrorAction SilentlyContinue | Copy-Item -Destination release\
          
          foreach ($folder in @("platforms", "styles", "imageformats", "iconengines", "networkinformation", "tls", "translations", "resources", "qml", "webchannel")) {
            if (Test-Path "build\$folder") {
              Copy-Item -Recurse "build\$folder" release\
            }
          }
          
          if (Test-Path "background.png") { Copy-Item "background.png" release\ }
          if (Test-Path "nighttheme.png") { Copy-Item "nighttheme.png" release\ }
          
          Compress-Archive -Path release\* -DestinationPath RootBrowser-Windows.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RootBrowser-Windows
          path: RootBrowser-Windows.zip
          retention-days: 90

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: RootBrowser-Windows.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
